name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/extractor-go/go/go.mod
          cache-dependency-path: packages/extractor-go/go/go.mod

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      # npm trusted publishing with the OIDC token of the job needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1

      - run: npm ci

      # The script runs the conformance suite on the fixture repos that it packs,
      # so a failed suite stops the release before anything is published.
      - run: npm run release-assets -- "$GITHUB_REF_NAME" release-assets node packages/cli/src/cli.ts

      - run: npm run test:pack

      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release-assets/*
        env:
          GH_TOKEN: ${{ github.token }}

      # npm logs why the OIDC token exchange fails only at the verbose level.
      - run: npm publish --workspace @callmap/cli --loglevel verbose
