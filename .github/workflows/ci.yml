name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: callmap-go/go.mod
          cache-dependency-path: callmap-go/go.mod

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - run: npm ci

      - run: npm run lint

      # A shared runner has about 2 test workers, so the tests that load the
      # full TypeScript compiler in a child process need more than the default.
      - run: npm test -- --testTimeout=30000 --hookTimeout=60000

      - run: npm run conformance -- --language typescript node callmap-ts/src/cli.ts

  callmap-go:
    name: callmap-go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: callmap-go/go.mod
          cache-dependency-path: callmap-go/go.mod

      - run: npm ci

      # go install builds from the files of the module only, so callmap-go embeds a copy of the test globs.
      - run: cmp packages/scope/test-globs.json callmap-go/internal/scope/test-globs.json

      # The build reads the vendored modules, so it needs no network.
      - run: go install .
        working-directory: callmap-go
        env:
          GOPROXY: 'off'

      - run: npm run conformance -- --language go "$(go env GOPATH)/bin/callmap-go"

  callmap-rb:
    name: callmap-rb
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - run: npm ci

      # The gem build copies the page template of the build of the same commit.
      - run: npm run build --workspace @callmap/reader-page

      - run: gem build callmap-rb.gemspec --output "$RUNNER_TEMP/callmap-rb.gem"
        working-directory: callmap-rb

      - run: gem install --local --no-document --install-dir "$RUNNER_TEMP/gem-home" --bindir "$RUNNER_TEMP/gem-home/bin" "$RUNNER_TEMP/callmap-rb.gem"

      # The installed command reviews each Ruby fixture repo of the same commit.
      - run: npm run conformance -- --language ruby "$RUNNER_TEMP/gem-home/bin/callmap-rb"
        env:
          GEM_HOME: ${{ runner.temp }}/gem-home
          GEM_PATH: ${{ runner.temp }}/gem-home

  packed-cli:
    name: packed cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # It packs callmap-ts, and runs the review command of the install.
      - run: npm run test:pack
