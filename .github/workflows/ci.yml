name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # The shared test of the walks runs the Ruby extractor.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - run: npm ci

      - run: npm run lint

      # The tests of the core and of the page. The job of each distribution runs its own tests on each of its legs.
      # A shared runner has about 2 test workers, so the tests that load the
      # full TypeScript compiler in a child process need more than the default.
      - run: npm test -- --testTimeout=30000 --hookTimeout=60000 --exclude 'callmap-ts/**' --exclude 'callmap-go/**' --exclude 'callmap-rb/**'

  # Each distribution has 3 legs: Linux and macOS with the current runtime, and Linux with the runtime floor
  # that its manifest declares. The name of a leg holds the distribution, the platform and the runtime version.
  callmap-ts:
    name: callmap-ts on ${{ matrix.platform }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: Linux, node: 22.x }
          - { os: macos-latest, platform: macOS, node: 22.x }
          - { os: ubuntu-latest, platform: Linux, node: 22.18.0 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test -- callmap-ts/test

      - run: npm run conformance -- --language typescript node callmap-ts/src/cli.ts

  callmap-go:
    name: callmap-go on ${{ matrix.platform }}, Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: Linux, go: 1.26.x }
          - { os: macos-latest, platform: macOS, go: 1.26.x }
          - { os: ubuntu-latest, platform: Linux, go: 1.26.0 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: callmap-go/go.mod

      - run: npm ci

      # go install builds from the files of the module only, so callmap-go embeds a copy of the test globs.
      - run: cmp packages/scope/test-globs.json callmap-go/internal/scope/test-globs.json

      - run: npm test -- callmap-go/test

      # The build reads the vendored modules, so it needs no network.
      - run: go install .
        working-directory: callmap-go
        env:
          GOPROXY: 'off'

      - run: npm run conformance -- --language go "$(go env GOPATH)/bin/callmap-go"

  callmap-rb:
    name: callmap-rb on ${{ matrix.platform }}, Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: Linux, ruby: '3.4' }
          - { os: macos-latest, platform: macOS, ruby: '3.4' }
          - { os: ubuntu-latest, platform: Linux, ruby: '3.1' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - run: npm ci

      # The gem build copies the page template of the build of the same commit.
      - run: npm run build --workspace @callmap/reader-page

      - run: npm test -- callmap-rb/test

      - run: gem build callmap-rb.gemspec --output "$RUNNER_TEMP/callmap-rb.gem"
        working-directory: callmap-rb

      - run: gem install --local --no-document --install-dir "$RUNNER_TEMP/gem-home" --bindir "$RUNNER_TEMP/gem-home/bin" "$RUNNER_TEMP/callmap-rb.gem"

      # The installed command reviews each Ruby fixture repo of the same commit.
      - run: npm run conformance -- --language ruby "$RUNNER_TEMP/gem-home/bin/callmap-rb"
        env:
          GEM_HOME: ${{ runner.temp }}/gem-home
          GEM_PATH: ${{ runner.temp }}/gem-home

  packed-cli:
    name: packed cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      # It packs callmap-ts, and runs the review command of the install.
      - run: npm run test:pack
