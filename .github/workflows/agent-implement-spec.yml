name: Agent Implement Spec

on:
  issues:
    types: [labeled]

jobs:
  implement-spec:
    if: github.event.label.name == 'agent:implement-spec' || github.event.label.name == 'agent:auto'
    runs-on: ubuntu-latest
    # A spec runs one agent per ticket in a row, so it needs far more time than
    # one issue. 350 minutes stays under the 360 minute cap of a hosted runner.
    timeout-minutes: 350
    concurrency:
      group: agent-implement-spec-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      SPEC_NUMBER: ${{ github.event.issue.number }}
      SPEC_TITLE: ${{ github.event.issue.title }}
      TRIGGER_LABEL: ${{ github.event.label.name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Detect spec shape
        id: shape
        run: |
          set -euo pipefail
          open_count=$(gh api --paginate "repos/${GH_REPO}/issues/${SPEC_NUMBER}/sub_issues" --jq '[.[] | select(.state == "open")] | length' | awk '{s+=$1} END {print s+0}')
          echo "open_count=$open_count" >> "$GITHUB_OUTPUT"
          if [ "$open_count" -gt 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      # agent:auto on a single issue belongs to agent-implement.yml, so skip it quietly.
      - name: Refuse issue without open sub-issues
        if: steps.shape.outputs.proceed != 'true' && github.event.label.name != 'agent:auto'
        run: |
          gh issue edit "$SPEC_NUMBER" --remove-label "$TRIGGER_LABEL" || true
          gh issue comment "$SPEC_NUMBER" --body "Refused to run: issue #${SPEC_NUMBER} has no open sub-issues. Use \`agent:implement\` for a single issue."

      - name: Preflight existing PR
        if: steps.shape.outputs.proceed == 'true'
        id: preflight
        run: |
          set -euo pipefail
          existing=$(gh pr list \
            --state open \
            --search "in:body \"#${SPEC_NUMBER}\"" \
            --json number,url,body,author \
            --jq "[.[] | select(.body | test(\"(?i)(closes|fixes|resolves|part of)\\\\s+#${SPEC_NUMBER}\\\\b\"))]")
          count=$(echo "$existing" | jq 'length')
          refused=false
          existing_pr_url=""
          for i in $(seq 0 $((count - 1))); do
            author=$(echo "$existing" | jq -r ".[$i].author.login")
            # Only PRs from collaborators block the agent; outside contributors don't count.
            if gh api "repos/${GH_REPO}/collaborators/${author}" --silent 2>/dev/null; then
              refused=true
              existing_pr_url=$(echo "$existing" | jq -r ".[$i].url")
              break
            fi
          done
          echo "refused=$refused" >> "$GITHUB_OUTPUT"
          echo "existing_pr_url=$existing_pr_url" >> "$GITHUB_OUTPUT"

      - name: Refuse existing PR
        if: steps.preflight.outputs.refused == 'true'
        env:
          EXISTING_PR_URL: ${{ steps.preflight.outputs.existing_pr_url }}
        run: |
          gh issue edit "$SPEC_NUMBER" --remove-label "$TRIGGER_LABEL" || true
          gh issue comment "$SPEC_NUMBER" --body "Refused to run: $EXISTING_PR_URL already targets this spec. Close it first, then re-add \`$TRIGGER_LABEL\`."

      - name: Transition labels
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: |
          gh issue edit "$SPEC_NUMBER" --remove-label "$TRIGGER_LABEL" || true
          gh issue edit "$SPEC_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$SPEC_NUMBER" --add-label "agent:in-progress"

      - name: Checkout the base branch
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # The agent runs unsandboxed with this checkout as its cwd, so never
          # leave the token in .git/config where injected text could reach it.
          # The push step below re-authenticates explicitly.
          persist-credentials: false

      - name: Compute branch name
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        id: branch
        run: |
          slug=$(echo "$SPEC_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/^spec:[[:space:]]*//; s/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          branch="spec/${SPEC_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git config user.name "sandcastle-agent[bot]"
          git config user.email "sandcastle-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Setup Node.js
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: |
          npm ci
          npm ci --prefix .sandcastle

      - name: Setup Go
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/extractor-go/go/go.mod
          cache: false

      - name: Setup Ruby
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Claude Code
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        # Pinned so upgrades are deliberate; bump this version on purpose.
        run: npm install -g @anthropic-ai/claude-code@2.1.317

      - name: Run implement-spec agent
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: .sandcastle/node_modules/.bin/tsx .sandcastle/agent-workflows/implement-spec/implement-spec.ts

      - name: Push branch
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          # Match the checkout token (AGENT_PAT preferred) so the branch is
          # pushed by the same identity that opens the PR.
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git push --force origin "$BRANCH"

      - name: Open PR
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        id: open_pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          # Author the PR as AGENT_PAT (a real user) instead of GITHUB_TOKEN
          # (github-actions[bot]). A bot-authored PR makes GitHub gate its CI and
          # review runs behind the "approve workflows to run" prompt; a
          # user-authored one runs them directly. Falls back to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          title="${SPEC_TITLE:0:256}"
          pr_url=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "$title" --body-file "${RUNNER_TEMP}/pr-body.md")
          echo "pr_number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"

      - name: Report skipped tickets
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
        run: |
          result="${RUNNER_TEMP}/spec_result.json"
          if [ "$(jq '.skipped | length' "$result")" -eq 0 ]; then
            exit 0
          fi
          body_file="${RUNNER_TEMP}/skipped-comment.md"
          {
            echo "\`agent:implement-spec\` built part of this spec in #${PR_NUMBER}. These tickets are not built:"
            echo
            jq -r '.skipped[] | "- #\(.number) \(.title): \(.reason)"' "$result"
          } > "$body_file"
          gh issue comment "$SPEC_NUMBER" --body-file "$body_file"

      - name: Request automated review
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Events created with GITHUB_TOKEN never trigger other workflows
          # (GitHub anti-recursion), so agent-review.yml only fires when the
          # label is applied with AGENT_PAT.
          set +e
          # agent:auto on the PR starts the review and marks the PR for the
          # review and fix loop in .sandcastle/agent-workflows/auto/continue.sh.
          if [ "$TRIGGER_LABEL" = "agent:auto" ] && [ -n "$AGENT_PAT" ]; then
            GH_TOKEN="$AGENT_PAT" gh pr edit "$PR_NUMBER" --add-label "agent:auto" && exit 0
          fi
          if [ -n "$AGENT_PAT" ]; then
            GH_TOKEN="$AGENT_PAT" gh pr edit "$PR_NUMBER" --add-label "agent:review"
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
          fi
          GH_TOKEN="$GITHUB_TOKEN_FALLBACK" gh pr edit "$PR_NUMBER" --add-label "agent:review"
          GH_TOKEN="$GITHUB_TOKEN_FALLBACK" gh pr comment "$PR_NUMBER" --body "Applied \`agent:review\` with \`GITHUB_TOKEN\`, which cannot trigger workflows, so the automated review will not start on its own. Configure the \`AGENT_PAT\` secret to enable auto-triggering, or remove and re-add the \`agent:review\` label to run the review manually."

      - name: Mark blocked on failure
        if: steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="(no reason file written; check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          body_file="${RUNNER_TEMP}/failure-comment.md"
          printf '`%s` run failed.\n\n**Reason:** %s\n\n**Workflow run:** %s\n\nRe-add `%s` to retry.\n' "$TRIGGER_LABEL" "$reason" "$RUN_URL" "$TRIGGER_LABEL" > "$body_file"
          gh issue edit "$SPEC_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$SPEC_NUMBER" --body-file "$body_file"

      - name: Always remove in-progress
        if: always() && steps.shape.outputs.proceed == 'true' && steps.preflight.outputs.refused != 'true'
        run: gh issue edit "$SPEC_NUMBER" --remove-label "agent:in-progress" || true
